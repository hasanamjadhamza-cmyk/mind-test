<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرآة العقل</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#4f46e5;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--tx:#f2f2f4;--mu:#9a9aa3;--ac:#8b85ff;--bd:#2c2c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--tx:#f2f2f4;--mu:#9a9aa3;--ac:#8b85ff;--bd:#2c2c33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
.w{max-width:600px;margin:0 auto;padding:20px 16px 40px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}
.b{width:100%;font:inherit;font-size:17px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;margin-top:12px;cursor:pointer}
.b:disabled{opacity:.5}
textarea{width:100%;min-height:220px;font:inherit;font-size:16px;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;resize:vertical}
.hide{display:none}
.big{font-size:68px;font-weight:700;color:var(--ac);text-align:center;line-height:1.1}
.r{margin:10px 0;font-size:15px}.r .t{display:flex;justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac)}
.tl{border-inline-start:3px solid var(--ac);padding:4px 12px;margin:14px 0}
.tm{font-size:13px;color:var(--ac);font-weight:600}
.q{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:15px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="w">
<div id="intro" class="c">
<h1>🧠 مرآة العقل</h1>
<p>ما فيه أسئلة هنا. أنت تكتب أفكارك الخاصة اللي ابتكرتها بنفسك. الموقع يسجّل كل فكرة، ومتى جاءتك، وكم توقفت قبلها، وهل رجعت وعدّلت. بعدها يحلل كيف فكرت ويعطيك تقديراً تقريبياً لذكائك.</p>
<p class="mu">اكتب بحرية وبالترتيب اللي يجيك، وكلما شرحت كيف وصلت للفكرة كان التحليل أدق.</p>
<button class="b" onclick="go()">ابدأ</button>
</div>
<div id="t" class="c hide">
<div class="mu" id="n"></div>
<h2 id="pq" style="font-size:19px;margin:6px 0"></h2>
<textarea id="ta" placeholder="اكتب أفكارك بالترتيب اللي جتك..."></textarea>
<button class="b" id="nx" onclick="fin()">التالي</button>
</div>
<div id="res" class="c hide"></div>
</div>
<script>
var P=["اكتب هنا أفكارك الخاصة اللي ابتكرتها أنت: نظريات، اختراعات، تفسيرات لأشياء تلاحظها، حلول، أو طريقة تفكير خاصة فيك. اشرح كل فكرة وكيف وصلت لها."];
var cur=-1,log=[],ch=null,tmr=null,prev="",T0=0,pst=0,fx=null;
function el(s){return document.getElementById(s)}
function go(){el("intro").classList.add("hide");el("t").classList.remove("hide");T0=Date.now();cur=-1;log=[];nxt()}
function nxt(){cur++;if(cur>=P.length){return done()}
var ta=el("ta");ta.value="";prev="";ch=null;pst=Date.now();
el("n").textContent="أفكارك";el("pq").textContent=P[cur];
log.push({q:P[cur],start:Math.round((pst-T0)/1000),chunks:[],final:""});
el("nx").textContent=cur==P.length-1?"حلّل تفكيري":"التالي";ta.focus()}
function close(){clearTimeout(tmr);if(ch&&(ch.text.trim()||ch.dels)){ch.end=Math.round((Date.now()-T0)/1000);log[cur].chunks.push(ch)}ch=null}
el("ta").addEventListener("input",function(e){
var v=this.value,now=Date.now();
if(!ch){var gap=Math.round((now-(log[cur].lastT||pst))/1000);ch={at:new Date(now).toLocaleTimeString("ar"),start:Math.round((now-T0)/1000),gap:gap,text:"",dels:0}}
if(v.length>prev.length)ch.text+=v.slice(prev.length);else ch.dels+=prev.length-v.length;
prev=v;log[cur].lastT=now;clearTimeout(tmr);tmr=setTimeout(close,3500)});
function fin(){close();log[cur].final=el("ta").value;if(!log[cur].final.trim()){alert("اكتب شيئاً أولاً");return}nxt()}
function esc(s,t){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function local(){
var txt=log.map(function(p){return p.final}).join(" "),w=txt.split(/\s+/).filter(Boolean),n=w.length;
var u=new Set(w).size/Math.max(n,1);
var cn=["لأن","لذلك","إذا","لكن","بينما","وبالتالي","مثلا","مثلاً","أو","بدل","رغم","غير أن","نتيجة","بسبب","يعني"];
var cc=0;cn.forEach(function(c){cc+=(txt.split(c).length-1)});
var ch=log[0].chunks,dels=0,pauses=0;ch.forEach(function(c){dels+=c.dels;if(c.gap>=4)pauses++});
var cl=function(x){return Math.max(0,Math.min(100,Math.round(x)))};
var sc={"التفكير":cl(20+cc*6),"الاستيعاب":cl(15+u*60+Math.min(n,300)/12),"قوة التفكير":cl(10+Math.min(n,400)/6+u*30),"طريقة التفكير":cl(30+Math.min(ch.length,10)*4+(dels>0?10:0)+(pauses>0?10:0))};
var avg=(sc["التفكير"]+sc["الاستيعاب"]+sc["قوة التفكير"]+sc["طريقة التفكير"])/4;
var iq=Math.round(80+avg*0.5);
var thoughts=ch.map(function(c){return{problem:1,atSec:c.start,idea:"",how:"",rating:""}});
return{iq:iq,low:iq-12,high:iq+12,level:n<40?"النص قصير جداً للحكم":iq>=115?"فوق المتوسط":iq>=95?"متوسط":"أقل من المتوسط",scores:sc,summary:"كتبت "+n+" كلمة في "+ch.length+" دفعة، مع "+pauses+" توقفات طويلة و"+dels+" حرفاً محذوفاً. التقدير مبني على مؤشرات في النص (الترابط المنطقي وتنوع المفردات وطول الشرح) وليس على فهم محتوى الأفكار.",thoughts:[],caveat:"هذا تقدير آلي بسيط جداً، لا يقيّم أصالة الأفكار ولا صحتها، ولا يُعتمد عليه كقياس حقيقي للذكاء."}}
function done(){
el("t").classList.add("hide");var r=el("res");r.classList.remove("hide");
r.innerHTML='<p>⏳ جاري تحليل أفكارك...</p>';
var total=Math.round((Date.now()-T0)/1000),analysis=null,err="";
try{analysis=local()}catch(e){err="تعذّر التحليل."}
var h="";
if(analysis){h+='<div class="mu" style="text-align:center">تقديرك التقريبي</div><div class="big">'+esc(analysis.iq)+'</div><div style="text-align:center"><b>'+esc(analysis.level)+'</b><br><span class="mu">المدى: '+esc(analysis.low)+' – '+esc(analysis.high)+'</span></div><p>'+esc(analysis.summary)+'</p>';
Object.keys(analysis.scores||{}).forEach(function(k){var v=analysis.scores[k];h+='<div class="r"><div class="t"><span>'+esc(k)+'</span><b>'+esc(v)+'%</b></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,+v))+'%"></i></div></div>'})}
else h+='<p>'+esc(err)+' هذا سجل أفكارك على أي حال:</p>';
h+='<h3 style="margin-top:20px">خريطة أفكارك: ماذا ومتى وكيف</h3><p class="mu">الوقت الكلي: '+Math.floor(total/60)+' د '+(total%60)+' ث</p>';
log.forEach(function(p,i){
p.chunks.forEach(function(c){
h+='<div class="tl"><div class="tm">الساعة '+esc(c.at)+' · بعد '+c.start+' ث · توقف '+c.gap+' ث قبلها'+(c.dels?' · حذف '+c.dels+' حرفاً':'')+'</div><div class="q">'+esc(c.text.trim())+'</div>';
if(analysis&&analysis.thoughts){var m=analysis.thoughts.filter(function(x){return x.problem==i+1&&Math.abs(x.atSec-c.start)<=Math.max(8,0)}).slice(0,1)[0];
if(m)h+='<div class="mu"><b>'+esc(m.rating)+'</b> · '+esc(m.how)+'</div>'}
h+='</div>'});
if(analysis&&analysis.thoughts){var ex=analysis.thoughts.filter(function(x){return x.problem==i+1});
if(ex.length){h+='<div class="mu" style="margin-top:6px">تحليل الأفكار:</div>';ex.forEach(function(x){h+='<div class="q"><b>'+esc(x.idea)+'</b> ('+esc(x.rating)+')\n'+esc(x.how)+'</div>'})}}});
if(analysis)h+='<p class="mu">'+esc(analysis.caveat)+'</p>';
h+='<button class="b" onclick="location.reload()">اختبار جديد</button>';
r.innerHTML=h;window.scrollTo(0,0)}
</script>
</body>
</html>
